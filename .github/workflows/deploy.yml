name: Deploy

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy.yml'
      - 'photos/**'
      - 'photo-descriptions.json'
      - 'apps/web/**'
      - 'packages/builder/**'
      - 'packages/data/**'
      - 'packages/hooks/**'
      - 'packages/sdk/**'
      - 'packages/ui/**'
      - 'packages/utils/**'
      - 'packages/webgl-viewer/**'
      - 'plugins/builder/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.json'
      - 'config.json'
      - 'builder.config.ts'
      - 'site.config.ts'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/deploy.yml'
      - 'photos/**'
      - 'photo-descriptions.json'
      - 'apps/web/**'
      - 'packages/builder/**'
      - 'packages/data/**'
      - 'packages/hooks/**'
      - 'packages/sdk/**'
      - 'packages/ui/**'
      - 'packages/utils/**'
      - 'packages/webgl-viewer/**'
      - 'plugins/builder/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.json'
      - 'config.json'
      - 'builder.config.ts'
      - 'site.config.ts'
  workflow_dispatch:

# Allow only one concurrent deployment while letting PR validation cancel stale runs.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '10.19.0'
  DEPLOY_REPOSITORY: Jackyhq/Photography-Web

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Standardize Photos
        run: pnpm run photos:standardize

      - name: Build manifest
        run: pnpm run build:manifest

      - name: Build web app
        env:
          AFILMORY_SKIP_MANIFEST_PRECHECK: 'true'
        run: pnpm run build

      - name: Check build output
        run: |
          if [ -d "./apps/web/dist" ]; then
            echo "Build directory exists."
          else
            echo "Error: Build directory ./apps/web/dist not found!"
            exit 1
          fi

  build-and-deploy:
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HAS_INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY != '' }}
      HAS_DEPLOY_REPO_TOKEN: ${{ secrets.DEPLOY_REPO_TOKEN != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Check deployment repository token
        if: env.HAS_DEPLOY_REPO_TOKEN != 'true'
        run: |
          echo "DEPLOY_REPO_TOKEN is required to push build output to ${DEPLOY_REPOSITORY}."
          exit 1

      - name: Configure Git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Sync latest source branch
        if: github.ref_type == 'branch'
        run: |
          git fetch origin "${GITHUB_REF_NAME}"
          git merge --ff-only "origin/${GITHUB_REF_NAME}"

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Standardize Photos
        run: pnpm run photos:standardize

      - name: Build manifest
        run: pnpm run build:manifest

      - name: Build web app
        env:
          AFILMORY_SKIP_MANIFEST_PRECHECK: 'true'
        run: pnpm run build

      - name: Check build output
        run: |
          if [ -d "./apps/web/dist" ]; then
            echo "Build directory exists."
          else
            echo "Error: Build directory ./apps/web/dist not found!"
            exit 1
          fi

      - name: Prepare sitemaps
        run: |
          if [ -f "./apps/web/dist/sitemap.xml" ]; then
            cp ./apps/web/dist/sitemap.xml ./apps/web/dist/googlesitemap.xml
            echo "Copied sitemap.xml to googlesitemap.xml"
          fi
          touch ./apps/web/dist/.nojekyll

      - name: Prepare README preview image
        shell: bash
        run: |
          shopt -s nullglob
          og_images=(apps/web/dist/og-image-*.png)

          if [ ${#og_images[@]} -eq 0 ]; then
            echo "No generated OG image found."
            exit 1
          fi

          latest_og_image="${og_images[$((${#og_images[@]} - 1))]}"
          cp "$latest_og_image" apps/web/dist/readme-og-image.png
          echo "Copied $latest_og_image to apps/web/dist/readme-og-image.png"

      - name: Publish IndexNow key file
        if: env.HAS_INDEXNOW_KEY == 'true'
        shell: bash
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          if [[ ! "$INDEXNOW_KEY" =~ ^[A-Za-z0-9-]{8,128}$ ]]; then
            echo "INDEXNOW_KEY must be 8-128 characters and contain only letters, numbers, or dashes."
            exit 1
          fi

          printf '%s' "$INDEXNOW_KEY" > "./apps/web/dist/${INDEXNOW_KEY}.txt"
          echo "Created IndexNow key file in apps/web/dist."

      - name: Commit standardized photos
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: update standardized photos"
          file_pattern: 'photos/**'
          add_options: '-A'

      - name: Checkout deployment repository
        uses: actions/checkout@v6
        with:
          repository: ${{ env.DEPLOY_REPOSITORY }}
          token: ${{ secrets.DEPLOY_REPO_TOKEN }}
          path: output-repo

      - name: Sync build output to deployment repository
        run: |
          rsync -a --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='README.md' \
            --exclude='LICENSE' \
            ./apps/web/dist/ ./output-repo/

      - name: Commit deployment repository changes
        working-directory: output-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No deployment repository changes."
          else
            git commit -m "chore: update site from ${GITHUB_SHA}"
            git push
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'apps/web/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
