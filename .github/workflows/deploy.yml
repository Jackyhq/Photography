name: Deploy

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy.yml'
      - 'photos/**'
      - 'apps/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'config.json'
      - 'builder.config.ts'
      - 'site.config.ts'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/deploy.yml'
      - 'photos/**'
      - 'apps/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'config.json'
      - 'builder.config.ts'
      - 'site.config.ts'
  workflow_dispatch:

# Allow only one concurrent deployment while letting PR validation cancel stale runs.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.19.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Standardize Photos
        run: pnpm run photos:standardize

      - name: Build manifest
        run: pnpm run build:manifest

      - name: Build web app
        run: pnpm run build

      - name: Check build output
        run: |
          if [ -d "./apps/web/dist" ]; then
            echo "Build directory exists."
          else
            echo "Error: Build directory ./apps/web/dist not found!"
            exit 1
          fi

  build-and-deploy:
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://photo.jackyw.cn
      SITEMAP_URL: https://photo.jackyw.cn/googlesitemap.xml
      SITEMAP_PATH: ./web/googlesitemap.xml
      GOOGLE_SEARCH_CONSOLE_SITE_URL: ${{ vars.GOOGLE_SEARCH_CONSOLE_SITE_URL || 'https://photo.jackyw.cn/' }}
      HAS_GOOGLE_SEARCH_CONSOLE_CREDENTIALS: ${{ secrets.GOOGLE_SEARCH_CONSOLE_CREDENTIALS != '' }}
      HAS_INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.19.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Standardize Photos
        run: pnpm run photos:standardize

      - name: Build manifest
        run: pnpm run build:manifest

      - name: Build web app
        run: pnpm run build

      - name: Check build output
        run: |
          if [ -d "./apps/web/dist" ]; then
            echo "Build directory exists."
          else
            echo "Error: Build directory ./apps/web/dist not found!"
            exit 1
          fi

      - name: Prepare sitemaps
        run: |
          if [ -f "./apps/web/dist/sitemap.xml" ]; then
            cp ./apps/web/dist/sitemap.xml ./apps/web/dist/googlesitemap.xml
            echo "Copied sitemap.xml to googlesitemap.xml"
          fi

      - name: Copy build output to /web
        run: |
          mkdir -p web
          rm -rf web/*
          cp -rp ./apps/web/dist/. web/
          echo "Copied build output to /web directory"

      - name: Prepare README preview image
        shell: bash
        run: |
          shopt -s nullglob
          og_images=(web/og-image-*.png)

          if [ ${#og_images[@]} -eq 0 ]; then
            echo "No generated OG image found."
            exit 1
          fi

          latest_og_image="${og_images[$((${#og_images[@]} - 1))]}"
          cp "$latest_og_image" web/readme-og-image.png
          echo "Copied $latest_og_image to web/readme-og-image.png"

      - name: Publish IndexNow key file
        if: env.HAS_INDEXNOW_KEY == 'true'
        shell: bash
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          if [[ ! "$INDEXNOW_KEY" =~ ^[A-Za-z0-9-]{8,128}$ ]]; then
            echo "INDEXNOW_KEY must be 8-128 characters and contain only letters, numbers, or dashes."
            exit 1
          fi

          printf '%s' "$INDEXNOW_KEY" > "./web/${INDEXNOW_KEY}.txt"
          echo "Created IndexNow key file in /web."

      - name: Pull latest changes to avoid non-fast-forward rejection
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash

      - name: Commit all changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: update photos and build output"
          file_pattern: 'photos/** web/**'
          add_options: '-A'

      - name: Authenticate Google Search Console
        id: google-auth
        if: env.HAS_GOOGLE_SEARCH_CONSOLE_CREDENTIALS == 'true'
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GOOGLE_SEARCH_CONSOLE_CREDENTIALS }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/webmasters

      - name: Notify search engines
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: node .github/scripts/notify-search-engines.mjs

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'apps/web/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
