name: Deploy

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy.yml'
      - 'content/photo-descriptions.json'
      - 'apps/web/**'
      - 'e2e/**'
      - 'packages/builder/**'
      - 'packages/data/**'
      - 'packages/docs/**'
      - 'packages/hooks/**'
      - 'packages/sdk/**'
      - 'packages/ui/**'
      - 'packages/utils/**'
      - 'packages/webgl-viewer/**'
      - 'plugins/builder/**'
      - 'plugins/eslint/**'
      - 'locales/**'
      - 'scripts/**'
      - 'env.ts'
      - 'eslint.config.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.json'
      - 'config.json'
      - 'builder.config.ts'
      - 'playwright.config.ts'
      - 'site.config.ts'
      - 'test/**'
      - 'vitest.config.ts'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/deploy.yml'
      - 'content/photo-descriptions.json'
      - 'apps/web/**'
      - 'e2e/**'
      - 'packages/builder/**'
      - 'packages/data/**'
      - 'packages/docs/**'
      - 'packages/hooks/**'
      - 'packages/sdk/**'
      - 'packages/ui/**'
      - 'packages/utils/**'
      - 'packages/webgl-viewer/**'
      - 'plugins/builder/**'
      - 'plugins/eslint/**'
      - 'locales/**'
      - 'scripts/**'
      - 'env.ts'
      - 'eslint.config.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.json'
      - 'config.json'
      - 'builder.config.ts'
      - 'playwright.config.ts'
      - 'site.config.ts'
      - 'test/**'
      - 'vitest.config.ts'
  repository_dispatch:
    types:
      - photos-updated
  workflow_dispatch:

# Allow only one concurrent deployment while letting PR validation cancel stale runs.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '10.19.0'
  DEPLOY_REPOSITORY: Jackyhq/Photography-Web
  PHOTO_REPOSITORY: Jackyhq/Photography-Photos
  PHOTO_REPOSITORY_BRANCH: main
  R2_PHOTOS_PREFIX: photos

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AFILMORY_E2E_FIXTURE: 'true'
      AFILMORY_PHOTOS_PATH: apps/web/public/__fixtures/photos
      AFILMORY_PHOTOS_BASE_URL: /__fixtures/photos/
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create public synthetic photo fixture
        run: pnpm run fixtures:photos

      - name: Validate photo standardization
        run: pnpm run photos:standardize

      - name: Build fixture manifest in strict mode
        run: pnpm run build:manifest -- --force --strict

      - name: Lint
        run: pnpm run lint:check

      - name: Type check workspace
        run: pnpm run type-check

      - name: Unit tests and coverage gates
        run: pnpm run test:coverage

      - name: Build documentation site
        run: pnpm run docs:build

      - name: Build web app
        env:
          AFILMORY_SKIP_MANIFEST_PRECHECK: 'true'
        run: pnpm run build

      - name: Check bundle budget
        run: pnpm run bundle:budget

      - name: Check build output
        run: |
          if [ -d "./apps/web/dist" ]; then
            echo "Build directory exists."
          else
            echo "Error: Build directory ./apps/web/dist not found!"
            exit 1
          fi

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E tests against production build
        env:
          PLAYWRIGHT_PRODUCTION: 'true'
        run: pnpm run test:e2e

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-validate
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  build-and-deploy:
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HAS_DEPLOY_REPO_TOKEN: ${{ secrets.DEPLOY_REPO_TOKEN != '' }}
      HAS_PHOTO_REPO_TOKEN: ${{ secrets.PHOTO_REPO_TOKEN != '' }}
      HAS_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID != '' }}
      HAS_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY != '' }}
      HAS_R2_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_ENDPOINT != '' }}
      HAS_R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Check required deployment secrets
        shell: bash
        run: |
          missing=()

          if [ "${HAS_DEPLOY_REPO_TOKEN}" != "true" ]; then
            missing+=("DEPLOY_REPO_TOKEN")
          fi

          if [ "${HAS_PHOTO_REPO_TOKEN}" != "true" ]; then
            missing+=("PHOTO_REPO_TOKEN")
          fi

          if [ "${HAS_R2_ACCESS_KEY_ID}" != "true" ]; then
            missing+=("CLOUDFLARE_R2_ACCESS_KEY_ID")
          fi

          if [ "${HAS_R2_SECRET_ACCESS_KEY}" != "true" ]; then
            missing+=("CLOUDFLARE_R2_SECRET_ACCESS_KEY")
          fi

          if [ "${HAS_R2_ENDPOINT}" != "true" ]; then
            missing+=("CLOUDFLARE_R2_ENDPOINT")
          fi

          if [ "${HAS_R2_BUCKET}" != "true" ]; then
            missing+=("CLOUDFLARE_R2_BUCKET")
          fi

          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing required secrets: %s\n' "${missing[*]}"
            exit 1
          fi

      - name: Configure Git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Sync latest source branch
        if: github.ref_type == 'branch'
        run: |
          git fetch origin "${GITHUB_REF_NAME}"
          git merge --ff-only "origin/${GITHUB_REF_NAME}"

      - name: Checkout photo repository
        uses: actions/checkout@v6
        with:
          repository: ${{ env.PHOTO_REPOSITORY }}
          ref: ${{ env.PHOTO_REPOSITORY_BRANCH }}
          token: ${{ secrets.PHOTO_REPO_TOKEN }}
          path: photos

      - name: Reject symlinks in photo repository
        shell: bash
        run: |
          first_symlink="$(find ./photos -path './photos/.git' -prune -o -type l -print -quit)"
          if [ -n "$first_symlink" ]; then
            echo "Symlinks are not allowed in the photo repository because photos are published to public storage."
            echo "Found symlink entries:"
            find ./photos -path './photos/.git' -prune -o -type l -print
            exit 1
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint:check

      - name: Validate and standardize photos
        run: pnpm run photos:standardize

      - name: Build manifest in strict mode
        run: pnpm run build:manifest -- --strict

      - name: Type check workspace
        run: pnpm run type-check

      - name: Unit tests and coverage gates
        run: pnpm run test:coverage

      - name: Build documentation site
        run: pnpm run docs:build

      - name: Build web app
        env:
          AFILMORY_SKIP_MANIFEST_PRECHECK: 'true'
        run: pnpm run build

      - name: Check bundle budget
        run: pnpm run bundle:budget

      - name: Check build output
        run: |
          if [ -d "./apps/web/dist" ]; then
            echo "Build directory exists."
          else
            echo "Error: Build directory ./apps/web/dist not found!"
            exit 1
          fi

      - name: Prepare sitemaps
        run: |
          if [ -f "./apps/web/dist/sitemap.xml" ]; then
            cp ./apps/web/dist/sitemap.xml ./apps/web/dist/googlesitemap.xml
            echo "Copied sitemap.xml to googlesitemap.xml"
          fi

      - name: Prepare README preview image
        shell: bash
        run: |
          shopt -s nullglob
          og_images=(apps/web/dist/og-image-*.png)

          if [ ${#og_images[@]} -eq 0 ]; then
            echo "No generated OG image found."
            exit 1
          fi

          latest_og_image="${og_images[$((${#og_images[@]} - 1))]}"
          cp "$latest_og_image" apps/web/dist/readme-og-image.png
          echo "Copied $latest_og_image to apps/web/dist/readme-og-image.png"

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E tests against production build
        env:
          PLAYWRIGHT_PRODUCTION: 'true'
        run: pnpm run test:e2e

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-build-and-deploy
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      # External writes start only after manifest, production build, budgets,
      # documentation, unit tests, and E2E have all passed.
      - name: Commit standardized photos to photo repository
        working-directory: photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No standardized photo changes."
          else
            git commit -m "chore: update standardized photos [skip dispatch]"
            git push origin "HEAD:${PHOTO_REPOSITORY_BRANCH}"
          fi

      - name: Sync photos to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}
          R2_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_ENDPOINT }}
        run: |
          if ! command -v aws >/dev/null 2>&1; then
            echo "AWS CLI is required on the runner to sync photos to Cloudflare R2."
            exit 1
          fi

          aws s3 sync ./photos "s3://${R2_BUCKET}/${R2_PHOTOS_PREFIX}/" \
            --endpoint-url "${R2_ENDPOINT}" \
            --size-only \
            --delete \
            --no-follow-symlinks \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude ".gitignore" \
            --exclude "README.md" \
            --exclude "incoming/*" \
            --exclude "incoming/**"

      - name: Checkout deployment repository
        uses: actions/checkout@v6
        with:
          repository: ${{ env.DEPLOY_REPOSITORY }}
          token: ${{ secrets.DEPLOY_REPO_TOKEN }}
          path: output-repo

      - name: Sync build output to deployment repository
        run: |
          rsync -a --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='README.md' \
            --exclude='LICENSE' \
            ./apps/web/dist/ ./output-repo/

      - name: Commit deployment repository changes
        working-directory: output-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No deployment repository changes."
          else
            git commit -m "chore: update site from ${GITHUB_SHA}"
            git push
          fi
